name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  actions: read
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - run: make check audit PYTHON=3.12
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          uv run python tools/verify_release.py
          --tag "$RELEASE_TAG"
          --dist-dir dist
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./dist
          artifact-name: release-sbom.cdx.json
          output-file: ./dist/release-sbom.cdx.json
          format: cyclonedx-json
          upload-artifact: false
      - name: Write and verify release checksums
        run: |
          uv run python tools/checksums.py write dist
          uv run python tools/checksums.py verify dist
      - name: Sign build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
